[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebsl-reproduction"
version = "0.1.0"
description = "Independent reproduction of TPAMI 2009 element rearrangement"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "torch", "pillow", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4"]
reports = ["reportlab==4.4.9", "pypdf>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/test_core.py" = ["E402"]
